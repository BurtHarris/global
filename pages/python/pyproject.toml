[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-pages"
version = "0.1.0"
description = "M365 Copilot Pages toolkit: AST conversion, deterministic patching, and FastMCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
test = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pages"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
